name: Furniture
version: '${version}'
main: cn.mcfhm.furniture.FurniturePlugin
api-version: '26.3'
authors: [FHM]
description: Display 实体家具系统，带自动生成的资源包
commands:
  furniture:
    description: 家具主命令
    usage: "/furniture help"
    aliases: [jiaju]
permissions:
  furniture.admin:
    description: 使用 give/place/remove/rotate/light/info/fill/pack/reload 管理命令
    default: op
  furniture.protect.bypass:
    description: 无视家具归属，能拆/旋转/打开别人的家具（不给默认值，只给信任的玩家组）
    default: false


