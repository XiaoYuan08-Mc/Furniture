# ===== 家具定义（由 tools/gen-catalog.ps1 生成，手改后也可以直接跑插件） =====
#   name          显示名（支持 & 颜色代码）
#   model         资源包里的 item model，格式 命名空间:模型名（对应 assets/命名空间/models/模型名.json）
#   material      物品本体材质（只影响背包图标底子，模型由 model 决定）
#   hitbox-width  交互碰撞箱宽度（格）
#   hitbox-height 交互碰撞箱高度（格）
#   view-range    显示实体的可见范围倍率（1.0 为默认）
#   transform     ItemDisplay 的显示变换上下文，默认 NONE（按方块 1:1 比例渲染）
#   scale         模型缩放，默认 1.0
#   offset-y      模型垂直偏移（格），默认 0（模型 y=0 贴地）
#   size-width    占地宽度（格，模型局部 +x 方向），多格家具用 2/3
#   size-depth    占地深度（格，模型局部 +z 方向）
#   seat          能否坐人（右键坐下），配 seat-y 指定坐姿高度
#   seat-y        坐姿高度（相对脚下方块底部，格；0.45~0.65 常见）
#   light         能否开关灯（右键切换模型亮度，同时点亮周围）
#   recipe        工作台合成配方；shaped: true 用 shape + ingredients，shaped: false 直接列材质

