# ===== Furniture 0.3.1 配置 =====

resource-pack:
  # 是否启用资源包（关闭后家具会显示成原材料的样子）
  enabled: true
  # builtin = 插件内置 HTTP 服务自动分发；external = 你自己托管 url
  mode: builtin
  # builtin 模式监听端口
  port: 8123
  # builtin 模式留空则自动使用本机局域网 IP；external 模式必填（指向 pack/FurniturePack.zip）
  public-url: ""
  prompt: "&e请接受资源包，否则自定义家具无法显示"
  force: false
  # 资源包格式区间：min 是包里模型需要的最低版本，max 决定客户端上限
  # 26.3 的资源包格式为 97.1；max 默认写 999.0 是有意放宽，避免客户端小版本不同就整包被拒
  pack-format:
    major: 97
    minor: 1
    max-major: 999
    max-minor: 0
  description: "FHM 家具 + 反透视 + 末影眼 + 附魔 + 槽位高亮"

place:
  # 放置后是否消耗手里的家具物品（上线务必保持 true，否则一件家具可以无限摆）
  consume-item: true
  # 拆除时是否掉落家具物品
  drop-item: true
  # /furniture remove 的搜索半径（格）
  remove-radius: 5

protect:
  # 家具归属保护：只有放置者（或带 furniture.admin / furniture.protect.bypass 权限的人）能拆、旋转、开容器
  # 关掉后回到"谁都能动"的旧行为
  enabled: true

interact:
  # 潜行 + 右键方块上的家具 = 顺时针旋转 90°
  sneak-rotate: true
  # 坐姿高度微调（格）：正常按家具模型算好的座位点落座，这里只是全局微调
  # 觉得所有人都浮在面上就填 -0.05，陷进去就填 0.05
  seat-offset: 0.0
  # 座位用 marker 隐形盔甲架（不挡碰撞）；如果坐不上去就改成 false
  seat-marker: true

collision:
  # 家具挡人：Display / Interaction 实体本身没有碰撞，这里给每个占地格塞一只
  # 完全隐形的潜影贝当墙，玩家就走不过去了。关掉 = 可以直接穿过所有家具
  enabled: true
  # 能坐的家具（椅子、床、沙发）默认不挡人，否则坐上去会被自己的碰撞箱顶出来
  # 想让椅子也挡墙就把这里改成 false，代价是起身时人可能卡在方块里
  skip-seatable: true

light:
  # 开灯时在锚点格放一个不可见的 light 方块（亮度 15），真正照亮周围地面和墙面
  # 关掉则只有模型自发光，夜里不会照亮环境
  place-block: true

# 是否在控制台输出资源包接受状态等调试信息
debug: false



